<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f3f3f3; }

        .payment-card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .inputbox {
            position: relative;
            margin-bottom: 25px;
        }

        .inputbox input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;
            padding: 8px 0;
            font-size: 15px;
        }

        .inputbox span {
            position: absolute;
            left: 0;
            top: -8px;
            font-size: 12px;
            color: #777;
        }

        .pay-btn {
            background: #5a4df5;
            color: #fff;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
        }

        .pay-btn:hover { background: #4b3fe0; }

        #card-section { display: none; }
    </style>
    <script src="https://js.stripe.com/v3/"></script>

</head>

<body>

<div class="container mt-5" style="max-width: 800px;">
<form method="post" action="/payment">

<div class="payment-card">

    <div class="section-title">BILLING ADDRESS</div>

    <div class="row">
        <div class="col-md-6">
            <div class="inputbox">
                <input type="text" name="street" required>
                <span>Street Address</span>
            </div>
        </div>
        <div class="col-md-6">
            <div class="inputbox">
                <input type="text" name="city" required>
                <span>City</span>
            </div>
        </div>
        <input type="hidden" name="csrf_token" value="{{ request.cookies.csrf_token }}">
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="inputbox">
                <input type="text" name="state" required>
                <span>State / Province</span>
            </div>
        </div>
        <div class="col-md-6">
            <div class="inputbox">
                <input type="text" name="zip" pattern="\d{6}" required>
                <span>Zip / Pincode (6 digits)</span>
            </div>
        </div>
    </div>

    <div class="section-title mt-4">PAYMENT METHOD</div>

    <div class="mb-3">
        <input type="radio" name="method" value="COD" checked onclick="toggleCard(false)">
        <label class="ms-2">Cash on Delivery</label>
    </div>

    <div class="mb-3">
        <input type="radio" name="method" value="CARD" onclick="toggleCard(true)">
        <label class="ms-2">Card</label>
    </div>

<div id="card-section">
    <div class="section-title mt-4">PAY USING UPI / CARD</div>
    <div id="payment-element"></div>
    <div id="stripe-loading" class="text-muted small mt-2" style="display:none;">Loading card fields...</div>
    <div id="payment-error-msg" class="text-danger small mt-2" style="display:none;"></div>
</div>

<input type="hidden" name="payment_intent_id" id="payment_intent_id">

    <div class="mt-4">
        <button type="submit" id="submit-btn" class="pay-btn">Pay ₹{{ total_amount }}</button>
    </div>

</div>
</form>
</div>
<script>
function toggleCard(show) {
    const section = document.getElementById("card-section");
    section.style.display = show ? "block" : "none";
}

const stripePk = "{{ stripe_pk }}";
const clientSecret = "{{ client_secret }}";
let stripe = null;
let elements = null;
let paymentElement = null;

if (stripePk && stripePk !== "None" && stripePk.trim() !== "") {
    try {
        stripe = Stripe(stripePk);
    } catch (err) {
        console.error("Failed to initialize Stripe:", err);
    }
}

function mountStripe() {
    if (paymentElement) return;

    if (!stripe || !clientSecret || clientSecret === "None") {
        const errorEl = document.getElementById("payment-error-msg");
        if (errorEl) {
            errorEl.innerText = "Payment provider configuration is pending. Please select Cash on Delivery (COD).";
            errorEl.style.display = "block";
        }
        return;
    }

    try {
        const loadingEl = document.getElementById("stripe-loading");
        if (loadingEl) loadingEl.style.display = "block";

        elements = stripe.elements({ clientSecret: clientSecret });
        paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

        paymentElement.on("ready", () => {
            if (loadingEl) loadingEl.style.display = "none";
        });
        paymentElement.on("loaderror", (event) => {
            if (loadingEl) loadingEl.style.display = "none";
            const errorEl = document.getElementById("payment-error-msg");
            if (errorEl) {
                errorEl.innerText = event.error ? event.error.message : "Failed to load payment fields.";
                errorEl.style.display = "block";
            }
        });
    } catch (err) {
        const loadingEl = document.getElementById("stripe-loading");
        if (loadingEl) loadingEl.style.display = "none";
        const errorEl = document.getElementById("payment-error-msg");
        if (errorEl) {
            errorEl.innerText = err.message || "Failed to initialize payment fields.";
            errorEl.style.display = "block";
        }
    }
}

document.querySelectorAll('input[name="method"]').forEach(radio => {
    radio.addEventListener("change", (e) => {
        if (e.target.value === "CARD") {
            toggleCard(true);
            mountStripe();
        } else {
            toggleCard(false);
        }
    });
});

const form = document.querySelector("form");
form.addEventListener("submit", async (e) => {
    const methodInput = document.querySelector('input[name="method"]:checked');
    const method = methodInput ? methodInput.value : "COD";

    if (method !== "CARD") return;

    if (!stripe || !elements) {
        e.preventDefault();
        alert("Card payment fields could not be loaded. Please choose Cash on Delivery (COD).");
        return;
    }

    e.preventDefault();
    const submitBtn = document.getElementById("submit-btn");
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";
    }

    try {
        const { error } = await stripe.confirmPayment({
            elements,
            redirect: "if_required"
        });

        if (error) {
            alert(error.message);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Pay ₹{{ total_amount }}";
            }
            return;
        }

        const { paymentIntent } = await stripe.retrievePaymentIntent(clientSecret);

        if (paymentIntent && paymentIntent.status === "succeeded") {
            document.getElementById("payment_intent_id").value = paymentIntent.id;
            form.submit();
        } else {
            alert("Payment could not be confirmed. Please check your card or select COD.");
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Pay ₹{{ total_amount }}";
            }
        }
    } catch (err) {
        alert("Payment error: " + err.message);
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Pay ₹{{ total_amount }}";
        }
    }
});

</script>


</body>
</html>
